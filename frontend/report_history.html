<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report History | Smart Financial Reporting Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebarContainer"></div>

        <div class="main-wrapper">
            <div id="topbarContainer"></div>

            <main class="content-body">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                    <div>
                        <h1 class="page-title">Report Archive & History</h1>
                        <p class="page-subtitle">Historical audit trail of all generated financial reports, P&L statements, and downloadable PDF files.</p>
                    </div>
                    <a href="reports.html?action=new" class="btn btn-sm btn-primary-custom">
                        <i class="bi bi-file-earmark-plus me-1"></i> Generate New Report
                    </a>
                </div>

                <div class="card-custom bg-white">
                    <div class="card-header-clean">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="card-title-clean">Generated Report Archive</h5>
                            <span id="reportHistoryCount" class="badge bg-light text-muted border">0 reports</span>
                        </div>
                        <div class="d-flex gap-2">
                            <select id="reportHistoryFilterType" class="form-select form-select-sm" style="width: 200px;" onchange="loadReportHistory()">
                                <option value="">All Report Types</option>
                                <option value="INCOME_EXPENSE">Income and Expense</option>
                                <option value="PROFIT_LOSS">Profit and Loss</option>
                                <option value="CASH_FLOW">Cash Flow</option>
                                <option value="EXPENSE_ANALYSIS">Expense Analysis</option>
                                <option value="REVENUE_ANALYSIS">Revenue Analysis</option>
                                <option value="FINANCIAL_PERFORMANCE">Financial Performance</option>
                                <option value="CUSTOM">Custom Reports</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>Generated On</th>
                                    <th>Report Title</th>
                                    <th>Report Type</th>
                                    <th>Reporting Period</th>
                                    <th>Currency</th>
                                    <th>Status</th>
                                    <th class="text-center" style="width: 140px;">Exports & Actions</th>
                                </tr>
                            </thead>
                            <tbody id="reportHistoryTbody">
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">Loading reports...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadReportHistory();
        });

        async function loadReportHistory() {
            const tbody = document.getElementById("reportHistoryTbody");
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Loading report archive...</td></tr>`;

            const repType = document.getElementById("reportHistoryFilterType").value;
            const params = repType ? { report_type: repType } : {};

            try {
                const res = await API.get("/reports", params);
                document.getElementById("reportHistoryCount").textContent = `${res.total} reports`;

                if (!res.items || res.items.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <div class="empty-state">
                                    <div class="empty-state-icon"><i class="bi bi-file-earmark-bar-graph"></i></div>
                                    <div class="empty-state-title">No Reports in Archive</div>
                                    <div class="empty-state-text">You haven't generated any financial statements yet.</div>
                                    <a href="reports.html?action=new" class="btn btn-sm btn-primary-custom">Generate Report Now</a>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                tbody.innerHTML = res.items.map(r => `
                    <tr>
                        <td class="small text-muted text-nowrap">${formatDate(r.created_at)}</td>
                        <td>
                            <a href="reports.html?id=${r.id}" class="fw-semibold text-primary text-decoration-none">
                                ${r.title}
                            </a>
                            ${r.notes ? `<small class="text-muted d-block text-truncate" style="max-width: 250px;">${r.notes}</small>` : ''}
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border">${r.report_type.replace(/_/g, ' ')}</span>
                        </td>
                        <td class="small text-muted text-nowrap">
                            ${formatDate(r.start_date)} to ${formatDate(r.end_date)}
                        </td>
                        <td class="small fw-bold">${r.currency}</td>
                        <td>
                            <span class="badge bg-success-light text-success border border-success-subtle">${r.generation_status}</span>
                        </td>
                        <td class="text-center text-nowrap">
                            <a href="${API_BASE_URL}/reports/${r.id}/export?format=pdf" class="btn btn-sm btn-outline-danger py-1 px-2" title="Download PDF">
                                <i class="bi bi-file-earmark-pdf"></i>
                            </a>
                            <a href="${API_BASE_URL}/reports/${r.id}/export?format=csv" class="btn btn-sm btn-outline-success py-1 px-2 ms-1" title="Export CSV">
                                <i class="bi bi-file-earmark-spreadsheet"></i>
                            </a>
                            <button class="btn btn-sm btn-light text-danger py-1 px-2 border ms-1" title="Delete" onclick="deleteReport('${r.id}', '${r.title.replace(/'/g, "\\'")}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join("");
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">${err.message}</td></tr>`;
            }
        }

        async function deleteReport(id, title) {
            if (confirm(`Delete '${title}' from archive?`)) {
                try {
                    await API.delete(`/reports/${id}`);
                    showToast("Report deleted.", "info");
                    loadReportHistory();
                } catch (e) {
                    showToast(e.message, "danger");
                }
            }
        }
    </script>
</body>
</html>

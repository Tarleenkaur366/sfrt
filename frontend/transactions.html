<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | Smart Financial Reporting Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebarContainer"></div>

        <div class="main-wrapper">
            <div id="topbarContainer"></div>

            <main class="content-body">
                <!-- Page Header -->
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                    <div>
                        <h1 class="page-title">Financial Transactions</h1>
                        <p class="page-subtitle">Manage, categorize, filter, and audit all financial cash movements and records.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-custom" onclick="exportTransactionsCsv()">
                            <i class="bi bi-file-earmark-arrow-down me-1"></i> Export Filtered CSV
                        </button>
                        <button class="btn btn-sm btn-primary-custom" data-bs-toggle="modal" data-bs-target="#transactionModal" onclick="openAddTransactionModal()">
                            <i class="bi bi-plus-circle me-1"></i> Add Transaction
                        </button>
                    </div>
                </div>

                <!-- Filter Bar Card -->
                <div class="card-custom p-3 mb-4 bg-white">
                    <form id="filterForm" class="row g-2 align-items-center">
                        <div class="col-md-3 col-sm-6">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                                <input type="text" id="filterSearch" class="form-control" placeholder="Search description, reference...">
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <select id="filterType" class="form-select form-select-sm">
                                <option value="">All Types</option>
                                <option value="Revenue">Revenue</option>
                                <option value="Other Income">Other Income</option>
                                <option value="Operating Expense">Operating Expense</option>
                                <option value="Cost of Goods Sold">Cost of Goods Sold</option>
                                <option value="Asset Purchase">Asset Purchase</option>
                                <option value="Liability Payment">Liability Payment</option>
                                <option value="Owner Contribution">Owner Contribution</option>
                                <option value="Owner Withdrawal">Owner Withdrawal</option>
                                <option value="Transfer">Transfer</option>
                            </select>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <select id="filterCategory" class="form-select form-select-sm">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <input type="date" id="filterStartDate" class="form-control form-control-sm" title="Start Date">
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <input type="date" id="filterEndDate" class="form-control form-control-sm" title="End Date">
                        </div>
                        <div class="col-md-1 col-sm-12 d-flex gap-1">
                            <button type="submit" class="btn btn-sm btn-primary w-100" title="Apply Filter">
                                <i class="bi bi-funnel"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-light border" onclick="resetFilters()" title="Reset Filters">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Transactions Table Card -->
                <div class="card-custom bg-white">
                    <div class="card-header-clean">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="card-title-clean">Transaction Records</h5>
                            <span id="txCountBadge" class="badge bg-light text-muted border">0 records</span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <select id="sortField" class="form-select form-select-sm" style="width: 140px;" onchange="loadTransactions()">
                                <option value="transaction_date" selected>Sort by Date</option>
                                <option value="amount">Sort by Amount</option>
                                <option value="description">Sort by Desc</option>
                            </select>
                            <select id="sortDir" class="form-select form-select-sm" style="width: 110px;" onchange="loadTransactions()">
                                <option value="desc" selected>Newest 1st</option>
                                <option value="asc">Oldest 1st</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description & Notes</th>
                                    <th>Classification</th>
                                    <th>Category</th>
                                    <th>Method / Ref</th>
                                    <th class="text-end">Amount</th>
                                    <th class="text-center" style="width: 90px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTbody">
                                <tr>
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                        Loading transaction ledger...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination Footer -->
                    <div class="p-3 border-top d-flex flex-wrap align-items-center justify-content-between gap-2" id="paginationControls">
                        <small class="text-muted" id="paginationInfo">Showing 0 to 0 of 0</small>
                        <ul class="pagination pagination-sm mb-0" id="paginationUl"></ul>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add / Edit Transaction Modal -->
    <div class="modal fade" id="transactionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Add New Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="transactionForm">
                    <div class="modal-body">
                        <input type="hidden" id="editTxId">
                        
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Description *</label>
                            <input type="text" id="txDescription" class="form-control" placeholder="e.g. Office Rent, Client Retainer, Software" required minlength="2">
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Amount *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light fw-bold" id="formCurrencyPrefix">₹</span>
                                    <input type="number" id="txAmount" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Transaction Date *</label>
                                <input type="date" id="txDate" class="form-control" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Classification *</label>
                                <select id="txType" class="form-select" required onchange="onTypeChanged()">
                                    <option value="Revenue">Revenue (Income)</option>
                                    <option value="Other Income">Other Income</option>
                                    <option value="Operating Expense" selected>Operating Expense</option>
                                    <option value="Cost of Goods Sold">Cost of Goods Sold (COGS)</option>
                                    <option value="Asset Purchase">Asset Purchase</option>
                                    <option value="Liability Payment">Liability Payment</option>
                                    <option value="Owner Contribution">Owner Contribution</option>
                                    <option value="Owner Withdrawal">Owner Withdrawal</option>
                                    <option value="Transfer">Transfer (Internal)</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Category</label>
                                <select id="txCategory" class="form-select">
                                    <option value="">Uncategorized</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Payment Method</label>
                                <select id="txPaymentMethod" class="form-select">
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Credit Card">Credit Card</option>
                                    <option value="Debit Card">Debit Card</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Cheque">Cheque</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Reference / Invoice #</label>
                                <input type="text" id="txReference" class="form-control" placeholder="INV-0012, TXN-998">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Notes & Remarks</label>
                            <textarea id="txNotes" class="form-control" rows="2" placeholder="Optional comments or contextual breakdown..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-sm btn-light border" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="saveTxBtn" class="btn btn-sm btn-primary-custom">Save Transaction</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/transactions.js"></script>
</body>
</html>

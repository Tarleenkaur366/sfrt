<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Smart Financial Reporting Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-5">

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
                <i class="bi bi-graph-up-arrow fs-2 text-primary"></i>
                <span class="fs-3 fw-bold text-dark">SmartFRT</span>
            </a>
            <p class="text-muted small">Sign in to your financial reporting dashboard</p>
        </div>

        <div class="card-custom p-4 p-md-5 bg-white shadow-md">
            <div id="loginAlert" class="alert alert-danger py-2 d-none small"></div>
            <div id="sessionNotice" class="alert alert-warning py-2 d-none small">
                <i class="bi bi-exclamation-triangle me-1"></i> Your session has expired. Please log in again.
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="loginEmail" class="form-control border-start-0" placeholder="name@company.com" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label small fw-semibold mb-0">Password</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" id="loginPassword" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary-custom w-100 py-2 mt-2">
                    <span id="btnText">Sign In</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <div class="small text-muted mb-2">Testing or evaluating?</div>
                <button type="button" class="btn btn-sm btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" onclick="fillDemoCredentials()">
                    <i class="bi bi-person-check-fill text-primary"></i> Fill Demo Account (demo@example.com)
                </button>
            </div>
        </div>

        <div class="text-center mt-4 text-muted small">
            Don't have an account yet? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Create an account</a>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("expired") === "true") {
                document.getElementById("sessionNotice").classList.remove("d-none");
            }
        });

        function fillDemoCredentials() {
            document.getElementById("loginEmail").value = "demo@example.com";
            document.getElementById("loginPassword").value = "DemoPassword123!";
            document.getElementById("loginAlert").classList.add("d-none");
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById("loginAlert");
            const submitBtn = document.getElementById("loginSubmitBtn");
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");

            alertBox.classList.add("d-none");
            submitBtn.disabled = true;
            btnText.textContent = "Authenticating...";
            btnSpinner.classList.remove("d-none");

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await API.post("/auth/login", { email, password });
                API.setSession(res.token, res.user);
                showToast("Signed in successfully!", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 400);
            } catch (err) {
                alertBox.textContent = err.message || "Invalid credentials.";
                alertBox.classList.remove("d-none");
                submitBtn.disabled = false;
                btnText.textContent = "Sign In";
                btnSpinner.classList.add("d-none");
            }
        });
    </script>
</body>
</html>

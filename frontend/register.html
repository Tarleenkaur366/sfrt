<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Financial Reporting Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light py-5">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-2">
                <i class="bi bi-graph-up-arrow fs-2 text-primary"></i>
                <span class="fs-3 fw-bold text-dark">SmartFRT</span>
            </a>
            <p class="text-muted small">Register your business or personal reporting account</p>
        </div>

        <div class="card-custom p-4 p-md-5 bg-white shadow-md">
            <div id="regAlert" class="alert alert-danger py-2 d-none small"></div>

            <form id="regForm">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name *</label>
                    <input type="text" id="regFullName" class="form-control" placeholder="John Doe" required minlength="2">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address *</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="name@company.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Business or Entity Name (Optional)</label>
                    <input type="text" id="regBusinessName" class="form-control" placeholder="Acme Enterprises LLC">
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-8">
                        <label class="form-label small fw-semibold">Password * (Min 8 characters)</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required minlength="8">
                    </div>
                    <div class="col-4">
                        <label class="form-label small fw-semibold">Currency</label>
                        <select id="regCurrency" class="form-select">
                            <option value="INR" selected>INR (₹)</option>
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                        </select>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                    <label class="form-check-label small text-muted" for="termsCheck">
                        I acknowledge that financial calculations reflect recorded transactions and do not replace formal accounting advice.
                    </label>
                </div>

                <button type="submit" id="regSubmitBtn" class="btn btn-primary-custom w-100 py-2">
                    <span id="btnText">Create Account</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                </button>
            </form>
        </div>

        <div class="text-center mt-4 text-muted small">
            Already have an account? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign In</a>
        </div>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById("regForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById("regAlert");
            const submitBtn = document.getElementById("regSubmitBtn");
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");

            alertBox.classList.add("d-none");
            submitBtn.disabled = true;
            btnText.textContent = "Creating Account...";
            btnSpinner.classList.remove("d-none");

            const payload = {
                full_name: document.getElementById("regFullName").value.trim(),
                email: document.getElementById("regEmail").value.trim(),
                password: document.getElementById("regPassword").value,
                business_name: document.getElementById("regBusinessName").value.trim() || null,
                default_currency: document.getElementById("regCurrency").value
            };

            try {
                const res = await API.post("/auth/register", payload);
                API.setSession(res.token, res.user);
                showToast("Account created successfully! Welcome to SmartFRT.", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 400);
            } catch (err) {
                alertBox.textContent = err.message || "Registration failed.";
                alertBox.classList.remove("d-none");
                submitBtn.disabled = false;
                btnText.textContent = "Create Account";
                btnSpinner.classList.add("d-none");
            }
        });
    </script>
</body>
</html>
